
name: Android 16 Cloud Emulator

on:
  workflow_dispatch:

jobs:
  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      AVD_NAME: Android16

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Avoid the obsolete "tools" SDK package.
      - name: Locate Android SDK Tools
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          SDK_DIR=$(dirname "$SDKMANAGER")

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$SDK_DIR/avdmanager" >> "$GITHUB_ENV"

          echo "SDK Manager: $SDKMANAGER"

      - name: Install Android 16 SDK
        timeout-minutes: 20
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

      - name: Create Android 16 Emulator
        run: |
          set -e

          echo "no" | "$AVDMANAGER" create avd \
            -n "$AVD_NAME" \
            -k "system-images;android-36;google_apis;x86_64" \
            -d pixel_2 \
            --force

      - name: Start Remote ADB Server
        shell: bash
        run: |
          set -e

          mkdir -p diagnostics

          # Allow ADB connections through the runner's network interfaces.
          adb -a -P 5037 nodaemon server \
            > adb-server.log 2>&1 &

          echo $! > adb-server.pid

          for i in $(seq 1 30); do
            if adb devices >/dev/null 2>&1; then
              echo "ADB server is ready"
              exit 0
            fi
            sleep 2
          done

          cat adb-server.log
          exit 1

      - name: Boot Android 16 Emulator
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking KVM..."

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ACCEL=on
            echo "KVM available"
          else
            ACCEL=off
            echo "KVM unavailable - software emulation may be slow"
          fi

          echo "Starting emulator..."

          emulator \
            -avd "$AVD_NAME" \
            -port 5554 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -no-snapshot-save \
            -wipe-data \
            -gpu swiftshader_indirect \
            -memory 4096 \
            -cores 2 \
            -camera-back none \
            -camera-front none \
            -no-metrics \
            -accel "$ACCEL" \
            > emulator.log 2>&1 &

          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > emulator.pid

          echo "Waiting for emulator device..."

          DEVICE_READY=0

          for i in $(seq 1 90); do
            if adb -s emulator-5554 get-state \
              >/dev/null 2>&1; then
              DEVICE_READY=1
              break
            fi

            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process stopped"
              tail -200 emulator.log
              exit 1
            fi

            echo "Waiting for device: $i/90"
            sleep 5
          done

          if [ "$DEVICE_READY" != "1" ]; then
            echo "Emulator device did not appear"
            tail -200 emulator.log
            exit 1
          fi

          echo "Device detected. Waiting for Android boot..."

          BOOTED=0

          for i in $(seq 1 180); do
            STATUS=$(adb -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null \
              | tr -d '\r' || true)

            if [ "$STATUS" = "1" ]; then
              BOOTED=1
              break
            fi

            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator crashed during boot"
              tail -200 emulator.log
              exit 1
            fi

            echo "Android boot progress: $i/180"
            sleep 5
          done

          if [ "$BOOTED" != "1" ]; then
            echo "Android boot timed out"

            echo "Emulator log:"
            tail -200 emulator.log

            echo "ADB devices:"
            adb devices -l

            echo "Android properties:"
            adb -s emulator-5554 shell getprop || true

            echo "Android logcat:"
            adb -s emulator-5554 logcat -d -t 500 || true

            exit 1
          fi

          echo "Android 16 successfully booted!"

          adb -s emulator-5554 shell wm size 1080x1920
          adb -s emulator-5554 shell wm density 420

          adb -s emulator-5554 shell input keyevent 82

          echo "Android version:"
          adb -s emulator-5554 shell getprop ro.build.version.release

      - name: Install Optional APK
        if: success()
        run: |
          if [ -f "app/app-release.apk" ]; then
            adb -s emulator-5554 install -r app/app-release.apk
          else
            echo "No APK found. Skipping installation."
          fi

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: github-android-emulator
          tags: tag:github-runner

      - name: Display Remote ADB Connection
        shell: bash
        run: |
          echo "=================================="
          echo "ANDROID 16 REMOTE ADB"
          echo "=================================="

          TAILSCALE_IP=$(tailscale ip -4)

          echo "Tailscale IP: $TAILSCALE_IP"
          echo "ADB Port: 5037"
          echo ""
          echo "Run on your Windows PC:"
          echo "adb -H $TAILSCALE_IP -P 5037 devices"
          echo ""
          echo "Open remote shell:"
          echo "adb -H $TAILSCALE_IP -P 5037 shell"
          echo "=================================="

          tailscale status
          adb devices -l

      - name: Keep Emulator Running
        shell: bash
        run: |
          echo "Android 16 emulator is running."

          while true; do
            echo "=================================="
            date -u

            if ! adb -s emulator-5554 get-state \
              >/dev/null 2>&1; then
              echo "ERROR: Emulator is no longer available"
              tail -100 emulator.log
              exit 1
            fi

            echo "Android:"
            adb -s emulator-5554 shell \
              getprop sys.boot_completed

            echo "Tailscale:"
            tailscale status

            echo "ADB devices:"
            adb devices -l

            sleep 60
          done

      - name: Collect Diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics

          cp emulator.log diagnostics/ 2>/dev/null || true
          cp adb-server.log diagnostics/ 2>/dev/null || true

          adb devices -l \
            > diagnostics/adb-devices.txt 2>&1 || true

          adb -s emulator-5554 logcat -d \
            > diagnostics/logcat.txt 2>&1 || true

          adb -s emulator-5554 shell getprop \
            > diagnostics/android-properties.txt 2>&1 || true

          free -h > diagnostics/memory.txt 2>&1 || true
          df -h > diagnostics/disk.txt 2>&1 || true

      - name: Upload Boot Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-16-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 3
