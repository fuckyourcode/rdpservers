
name: Android 16 Cloud Emulator - ADB Tailscale

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: "APK path (leave empty to skip)"
        required: false
        type: string
        default: "app/app-release.apk"

permissions:
  contents: read

jobs:
  android:
    name: Android 16 Remote Emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      AVD_NAME: Android16

    steps:

      # --------------------------------
      # 1. Checkout
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # 2. Setup Java
      # --------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------
      # 3. Configure existing Android SDK
      # --------------------------------
      - name: Configure Android SDK
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools not found"
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

          echo "Found SDK manager: $SDKMANAGER"

      # --------------------------------
      # 4. Install Android 16 packages
      # --------------------------------
      - name: Install Android 16 SDK
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

      # --------------------------------
      # 5. Create Android 16 AVD
      # --------------------------------
      - name: Create Android Emulator
        run: |
          set -e

          echo "no" | avdmanager create avd \
            --force \
            --name "$AVD_NAME" \
            --package "system-images;android-36;google_apis;x86_64" \
            --device "pixel_2"

          emulator -list-avds

      # --------------------------------
      # 6. Start Android Emulator
      # --------------------------------
      - name: Boot Android 16
        run: |
          set -e

          emulator \
            -avd "$AVD_NAME" \
            -port 5554 \
            -no-window \
            -gpu swiftshader_indirect \
            -accel auto \
            -no-snapshot \
            -no-boot-anim \
            -no-audio \
            -camera-back none \
            -camera-front none \
            > emulator.log 2>&1 &

          echo "Waiting for emulator..."

          adb start-server
          adb -s emulator-5554 wait-for-device

          BOOTED=0

          for i in $(seq 1 120); do

            STATUS=$(adb -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null |
              tr -d '\r')

            if [ "$STATUS" = "1" ]; then
              BOOTED=1
              break
            fi

            echo "Boot progress: $i / 120"
            sleep 5

          done

          if [ "$BOOTED" != "1" ]; then
            echo "Android boot failed"
            tail -100 emulator.log
            exit 1
          fi

          adb -s emulator-5554 shell wm size 1080x1920
          adb -s emulator-5554 shell wm density 420

          echo "Android 16 successfully booted!"

      # --------------------------------
      # 7. Install optional APK
      # --------------------------------
      - name: Install APK
        env:
          APK_PATH: ${{ inputs.apk_path }}
        run: |
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            adb -s emulator-5554 install -r "$APK_PATH"
            echo "APK installed successfully"
          else
            echo "No APK found. Skipping installation."
          fi

      # --------------------------------
      # 8. Connect Tailscale
      # --------------------------------
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: github-android-emulator
          tags: tag:github-runner

      # --------------------------------
      # 9. Enable remote ADB
      # --------------------------------
      - name: Enable Remote ADB Server
        run: |
          set -e

          adb kill-server || true

          # Listen on all network interfaces
          adb -a start-server

          sleep 5

          echo "Checking ADB server..."

          ss -lntp | grep 5037

          adb devices -l

          adb -s emulator-5554 wait-for-device

      # --------------------------------
      # 10. Show connection information
      # --------------------------------
      - name: Display Remote Connection
        run: |
          TS_IP=$(tailscale ip -4)

          echo "======================================"
          echo "ANDROID 16 CLOUD DEVICE ONLINE"
          echo "======================================"

          echo "Tailscale IP: $TS_IP"
          echo "ADB Server: $TS_IP:5037"

          echo ""
          echo "Windows PowerShell:"
          echo "adb -H $TS_IP -P 5037 devices"

          echo ""
          echo "Android Shell:"
          echo "adb -H $TS_IP -P 5037 shell"

          echo "======================================"

          {
            echo "## Android 16 Emulator"
            echo ""
            echo "| Service | Address |"
            echo "|---|---|"
            echo "| Tailscale | $TS_IP |"
            echo "| ADB | $TS_IP:5037 |"
            echo ""
            echo "## Windows commands"
            echo ""
            echo '```powershell'
            echo "adb -H $TS_IP -P 5037 devices"
            echo "adb -H $TS_IP -P 5037 shell"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------
      # 11. Infinite running loop
      # --------------------------------
      - name: Keep Android Emulator Alive
        run: |
          echo "======================================"
          echo "ANDROID 16 RUNNING"
          echo "Press Cancel workflow to stop."
          echo "======================================"

          while true; do

            echo ""
            echo "Time: $(date)"
            echo "Android Emulator:"

            adb devices -l

            echo ""
            echo "Tailscale:"
            tailscale status

            echo ""
            echo "Checking ADB server:"
            ss -lntp | grep 5037 || true

            echo ""
            echo "Next check in 60 seconds..."

            sleep 60

          done

      # --------------------------------
      # 12. Capture screenshot on exit
      # --------------------------------
      - name: Capture Android Screenshot
        if: always()
        run: |
          adb -s emulator-5554 exec-out screencap -p \
            > android-screen.png || true

      # --------------------------------
      # 13. Upload logs
      # --------------------------------
      - name: Upload Emulator Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android16-emulator-logs
          path: |
            emulator.log
            android-screen.png
          if-no-files-found: ignore
          retention-days: 1
