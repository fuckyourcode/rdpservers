name: Android 16 Remote Emulator - Tailscale ADB

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: "APK path (leave empty to skip)"
        required: false
        type: string
        default: "app/app-release.apk"

permissions:
  contents: read

jobs:
  android:
    name: Android 16 Emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      AVD_NAME: Android16

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------------
      # Probe KVM first, but do NOT fail if unavailable.
      # Standard GitHub-hosted runners often lack nested virtualization,
      # in which case /dev/kvm is missing or unusable.
      # ---------------------------------------------------------------
      - name: Probe KVM availability
        id: kvm
        shell: bash
        run: |
          set +e
          echo "Checking /dev/kvm ..."
          if [ -e /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is usable."
            echo "kvm_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "KVM is NOT usable. Emulator will use software acceleration."
            ls -l /dev/kvm 2>&1 || true
            echo "kvm_available=false" >> "$GITHUB_OUTPUT"
          fi
          set -e

      # Only apply udev rule if /dev/kvm actually exists
      - name: Enable KVM permissions
        if: steps.kvm.outputs.kvm_available == 'true'
        shell: bash
        run: |
          set -e
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Find Android SDK tools
        shell: bash
        run: |
          set -e
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          echo "SDK Manager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android 16 packages
        shell: bash
        run: |
          set -e
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"
          if [ ! -f "$ANDROID_HOME/platform-tools/adb" ]; then
            echo "ERROR: adb was not installed"
            exit 1
          fi
          "$ANDROID_HOME/platform-tools/adb" version

      - name: Create Android 16 AVD
        shell: bash
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "no" | avdmanager create avd \
            --force \
            --name "$AVD_NAME" \
            --package "system-images;android-36;google_apis;x86_64" \
            --device "pixel_2"
          emulator -list-avds

      - name: Boot Android 16 Emulator
        timeout-minutes: 40
        shell: bash
        run: |
          set -e
          ADB="$ANDROID_HOME/platform-tools/adb"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          # 动态选择加速模式
          if [ "${{ steps.kvm.outputs.kvm_available }}" = "true" ]; then
            echo "Using hardware acceleration (KVM)."
            ACCEL_FLAG="-accel on"
          else
            echo "Using software acceleration (no KVM). This will be slow."
            ACCEL_FLAG="-accel off"
          fi

          nohup "$EMULATOR" \
            -avd "$AVD_NAME" \
            -port 5554 \
            -no-window \
            -gpu swiftshader_indirect \
            $ACCEL_FLAG \
            -no-snapshot \
            -wipe-data \
            -no-boot-anim \
            -no-audio \
            -camera-back none \
            -camera-front none \
            -memory 3072 \
            -cores 2 \
            > emulator.log 2>&1 &

          echo "Waiting for Android emulator..."
          "$ADB" start-server
          "$ADB" -s emulator-5554 wait-for-device

          BOOTED=0
          # 软件模拟时给更长时间：40 分钟（480 次 × 5 秒）
          for i in $(seq 1 480); do
            STATUS=$("$ADB" -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$STATUS" = "1" ]; then
              BOOTED=1
              break
            fi
            echo "Android boot progress: $i/480"
            sleep 5
          done

          if [ "$BOOTED" != "1" ]; then
            echo "ERROR: Android failed to boot."
            echo "----- Emulator log (tail) -----"
            tail -200 emulator.log || true
            echo "----- ADB devices -----"
            "$ADB" devices -l || true
            exit 1
          fi

          sleep 10
          "$ADB" -s emulator-5554 wait-for-device
          "$ADB" -s emulator-5554 shell echo "adb responsive"
          "$ADB" -s emulator-5554 shell wm size 1080x1920
          "$ADB" -s emulator-5554 shell wm density 420
          echo "Android 16 successfully booted!"

      - name: Install APK
        shell: bash
        env:
          APK_PATH: ${{ inputs.apk_path }}
        run: |
          set -e
          ADB="$ANDROID_HOME/platform-tools/adb"
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            "$ADB" -s emulator-5554 install -r "$APK_PATH"
            echo "APK installed successfully."
          else
            echo "APK not found. Skipping installation."
          fi

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: github-android-emulator
          tags: tag:github-runner

      - name: Enable Remote ADB
        shell: bash
        run: |
          set -e
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" kill-server || true
          "$ADB" -a start-server
          sleep 5
          echo "ADB listening status:"
          ss -lntp | grep 5037 || true
          echo "Connected devices:"
          "$ADB" devices -l
          echo "Tailscale IP:"
          tailscale ip -4

      - name: Display Connection Details
        shell: bash
        run: |
          TS_IP=$(tailscale ip -4)
          echo "## Android 16 Remote Emulator" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tailscale IP: $TS_IP" >> "$GITHUB_STEP_SUMMARY"
          echo "ADB Server: $TS_IP:5037" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "### Windows PowerShell commands"
            echo '```powershell'
            echo "adb -H $TS_IP -P 5037 devices"
            echo "adb -H $TS_IP -P 5037 shell"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Remote ADB address: $TS_IP:5037"

      - name: Keep Emulator Alive
        shell: bash
        run: |
          ADB="$ANDROID_HOME/platform-tools/adb"
          echo "Remote Android emulator is running."
          echo "Cancel this workflow to stop it."
          while true; do
            echo "------------------------------"
            date
            "$ADB" devices -l
            tailscale status || true
            sleep 60
          done

      - name: Upload Emulator Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android16-emulator-diagnostics
          path: |
            emulator.log
          if-no-files-found: ignore
          retention-days: 3
